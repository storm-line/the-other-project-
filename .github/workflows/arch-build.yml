name: Arch Linux Build via Issue

on:
  issues:
    types: [opened, edited]

jobs:
  arch-job:
    if: contains(github.event.issue.title, '[build]')
    runs-on: ubuntu-latest
    
    container:
      image: archlinux:latest

    steps:
      - name: Check out project code
        uses: actions/checkout@v4

      - name: System initialization & Setup non-root user
        run: |
          # 1. 核心修正：先初始化並更新 Arch Linux 簽章金鑰，防止下載時驗證失敗
          pacman-key --init
          pacman-key --populate archlinux
          
          # 2. 核心修正：使用 --ask=4 讓 pacman 自動同意所有套件衝突與取代提問
          pacman -Syu --noconfirm --ask=4
          
          # 3. 安裝基礎工具
          pacman -S --noconfirm base-devel git sudo neofetch
          
          # 4. 建立普通用戶並設定權限
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE" || true


      - name: Display Arch Environment Info
        run: |
          su builder -c "neofetch"

      - name: Read Issue Body
        run: |
          echo "正在處理的 Issue 標題: ${{ github.event.issue.title }}"
          echo "----------------------------------------"
          echo "以下為 Issue 的詳細內文："
          cat << 'EOF'
          ${{ github.event.issue.body }}
          EOF

      - name: Run Build Command
        run: |
          echo "開始在 Arch Linux 執行你的編譯或指令..."

